[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rano"
version = "0.0.1"
description = "Volumetric-RANO longitudinal brain-MRI pipeline (data loader + validator)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "nibabel>=5.0",
    # pydantic lives at Piece 1's edges (config contract in, QC report out); the fingerprint
    # record (fingerprint/schema.py) is the first "QC report out" edge, so it's core now.
    "pydantic>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
