[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rano"
version = "0.0.1"
description = "Volumetric-RANO longitudinal brain-MRI pipeline (data loader + validator)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "nibabel>=5.0",
    # Piece 2. Atlas space puts every visit on one grid but not in one place -- each was
    # registered to the template independently, so consecutive visits' brains sit ~2.7mm apart.
    # Volumetry never noticed (a voxel count is blind to position); lesion tracking cannot work
    # without it. Rigid registration is a solved problem with quiet failure modes, so this is a
    # deliberate choice to use the field's standard tool rather than hand-roll one.
    "SimpleITK>=2.3",
    # pydantic lives at Piece 1's edges (config contract in, QC report out); the fingerprint
    # record (fingerprint/schema.py) is the first "QC report out" edge, so it's core now.
    "pydantic>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
